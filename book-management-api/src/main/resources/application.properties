# =============================================================
# BOOK MANAGEMENT API \u2014 APPLICATION CONFIGURATION
# Group: com.parikhsit | Spring Boot 3.5.14 | Java 21
# =============================================================

# -------------------------------------------------------------
# SERVER
# -------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api/v1

# -------------------------------------------------------------
# MYSQL DATABASE
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/book_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Canara@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------
# JPA / HIBERNATE
# -------------------------------------------------------------
# 'update' \u2192 auto-creates/updates the books table on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# CONNECTION POOL (HikariCP)
# -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------------
# JACKSON (JSON)
# -------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# -------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG